<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watcher - Multi-Engine Impact Analyzer</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="shortcut icon" type="image/png" href="/assets/logo.png">
  <link rel="apple-touch-icon" href="/assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <!-- Header Component (Brand logo, controls, diff selector, settings trigger) -->
  <header>
    {{COMPONENTS:header.html}}
  </header>

  <!-- Main Application Content -->
  <main>
    <!-- Top Overview: 2x2 KPI Cards + Cross-Module Dependency Graph -->
    <div class="top-overview-grid">
      {{COMPONENTS:overview_grid.html}}
    </div>

    <!-- Impact Explorer & Detailing Table -->
    {{COMPONENTS:impact_list.html}}

    <!-- RSpec Parallel Test Runner Suite -->
    {{COMPONENTS:test_runner.html}}
  </main>

  <!-- Modal Overlays -->
  <div id="modalContainer">
    {{COMPONENTS:modals/markdown_modal.html}}
    {{COMPONENTS:modals/ai_export_modal.html}}
    {{COMPONENTS:modals/settings_modal.html}}
  </div>

  <!-- Modular Frontend JavaScript Engine -->
  <script src="/js/app.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/scanner.js"></script>
  <script src="/js/renderers.js"></script>
  <script src="/js/modals.js"></script>
</body>
</html>
