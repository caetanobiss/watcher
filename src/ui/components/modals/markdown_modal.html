<!--
  =============================================================================
  Component: Markdown Export Modal (modals/markdown_modal.html)
  Description: Modal containing raw markdown output textarea and copy button.
  Usage: Included at the end of index.html inside modal overlays container.
  =============================================================================
-->

<div class="modal" id="mdModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 style="color: var(--text-bright);">📋 Relatório de Impacto (Markdown)</h3>
      <button class="close-btn" onclick="closeModal('mdModal')">&times;</button>
    </div>
    <div class="modal-body">
      <textarea id="mdTextarea" readonly style="width: 100%; height: 350px; background: var(--input-bg); color: var(--text-bright); border: 1px solid var(--panel-border); font-family: var(--font-mono); font-size: 0.85rem; padding: 1rem; border-radius: 8px;"></textarea>
      <button class="btn-primary" style="margin-top: 1rem;" onclick="copyMarkdownText()">Copiar para Área de Transferência</button>
    </div>
  </div>
</div>
